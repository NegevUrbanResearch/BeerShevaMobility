[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mobility"
version = "0.1.0"
description = "Beer Sheva mobility analysis pipeline"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "geopandas>=0.12",
    "numpy>=1.24",
    "openpyxl>=3.0",
    "python-dotenv>=1.0",
    "fuzzywuzzy>=0.18",
    "python-Levenshtein>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]
